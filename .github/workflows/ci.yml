name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-placeholder-secret-at-least-32-characters-long
      AUTH_URL: http://localhost:3000
      # Auth.js v5 in production mode (next start) refuses requests whose
      # host header isn't trusted unless trustHost is explicitly enabled.
      # Auth.js enables trust automatically in dev mode; the moment CI
      # moved from `pnpm dev` to `pnpm start` (Phase 9's webServer fix),
      # that automatic trust went away — signup POSTs began failing with
      # `UntrustedHost: Host must be trusted`. AUTH_URL is used for URL
      # construction; it does NOT imply host trust. AUTH_TRUST_HOST=true
      # is the explicit opt-in.
      AUTH_TRUST_HOST: "true"
      MODEL_PROVIDER: mock
      MOCK_SCENARIO: coach-regression

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Write apps/web/.env.local so Next.js loads the same env vars at
      # both build time and runtime that the job-level env: block
      # provides at shell level.
      #
      # Why this is required: the job-level env vars ARE visible to the
      # shell — `prisma migrate deploy` and `prisma db seed` both read
      # DATABASE_URL successfully. But `next build` and `next start` load
      # their env from files first. Without a file, the production
      # Next.js server started by Playwright's webServer did not see
      # DATABASE_URL, so every Prisma call from a Server Component failed
      # with "Environment variable not found: DATABASE_URL" — the signup
      # route rendered <html id="__next_error__"> instead of the app,
      # and every E2E spec that signs up timed out on the post-signup
      # redirect.
      #
      # AUTH_TRUST_HOST must be here too: it is read by Auth.js at
      # request time, from the Next.js process env — not from the shell
      # that started the process.
      - name: Write apps/web/.env.local for Next.js
        run: |
          cat > apps/web/.env.local << EOF
          DATABASE_URL=${DATABASE_URL}
          DIRECT_URL=${DIRECT_URL}
          AUTH_SECRET=${AUTH_SECRET}
          AUTH_URL=${AUTH_URL}
          AUTH_TRUST_HOST=${AUTH_TRUST_HOST}
          MODEL_PROVIDER=${MODEL_PROVIDER}
          MOCK_SCENARIO=${MOCK_SCENARIO}
          EOF

      - name: Apply migrations
        run: pnpm --filter @training/db exec prisma migrate deploy

      - name: Seed reference data
        run: pnpm --filter @training/db exec prisma db seed

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Launch gate (sanity check, non-production)
        run: pnpm --filter web run launch-gate

      - name: Provisional banner check
        run: pnpm --filter web run check:provisional-banner

      - name: Test (unit + integration)
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Rebuild web for E2E (fresh .next/)
        run: |
          rm -rf apps/web/.next
          pnpm --filter web run build

      - name: E2E (Playwright)
        run: pnpm --filter web test:e2e